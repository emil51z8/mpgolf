name: Deploy til Simply.com

on:
  push:
    branches: [ master ]
  workflow_dispatch:   # så du også kan køre den manuelt fra GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build   # laver ./out

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.simply.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/